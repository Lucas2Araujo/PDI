name: CI/CD Pipeline - Testes & Deploy Web

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Permissão padrão mínima para todos os jobs (Princípio do Menor Privilégio)
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: 🧪 Executar Suíte de Testes
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout do Código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Testes Unitários e de Integração
        run: |
          python -m unittest discover -s tests -v

  deploy-web:
    name: 🚀 Build & Deploy Web no GitHub Pages
    needs: test
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout do Código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@f2c4f40b957c37147774944d187f58d411edfe36 # v2.18.0
        with:
          channel: "stable"
          cache: true

      - name: Instalar Dependências e Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet-cli>=0.23.0

      - name: Compilar Versão Web Estática do App
        env:
          REPO_CONTEXT: ${{ github.repository }}
        run: |
          REPO_NAME=$(echo "$REPO_CONTEXT" | cut -d'/' -f2)
          echo "Compilando Flet Web para base-url: /${REPO_NAME}/"
          flet build web --base-url "/${REPO_NAME}/" --route-url-strategy hash --yes

      - name: Sincronizar Assets, Favicon e Configurações no Build Web
        run: |
          echo "Sincronizando assets, favicon e configurações do web build..."
          mkdir -p build/web/assets
          cp -rf assets/* build/web/assets/
          
          # Sobrescreve favicon e ícones no diretório raiz do web build
          cp -f assets/favicon.png build/web/favicon.png
          cp -f assets/favicon.ico build/web/favicon.ico 2>/dev/null || true
          
          # Sincroniza ícones do PWA
          if [ -d "assets/icons" ]; then
            mkdir -p build/web/icons
            cp -rf assets/icons/* build/web/icons/
          fi
          
          # Garante que o GitHub Pages/Jekyll não ignore arquivos WASM/dotfiles
          touch build/web/.nojekyll
          
          echo "Estrutura final de build/web:"
          ls -la build/web

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@983d7712d7b0a42eaf829e87129d164fa498fbdd # v5.0.0

      - name: Fazer Upload do Artefato Web
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: "build/web"

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
