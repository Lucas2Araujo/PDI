name: Export SonarQube Issues for Antigravity

on:
  workflow_dispatch: # Botão "Run workflow" manual no GitHub

permissions:
  contents: write # Necessário para commitar o arquivo de volta no repositório

jobs:
  export-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Buscar e Formatar Issues do SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ISSUES_URL: ${{ secrets.SONAR_ISSUES_URL }}
        run: |
          # 1. Valida se as secrets foram configuradas
          if [ -z "$SONAR_ISSUES_URL" ]; then
            echo "::error::A secret SONAR_ISSUES_URL está vazia ou não foi configurada como Repository Secret!"
            exit 1
          fi

          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::A secret SONAR_TOKEN está vazia ou não foi configurada como Repository Secret!"
            exit 1
          fi

          echo "Buscando apontamentos a partir da URL configurada..."

          # 2. Faz a requisição seguindo redirects (-L) e captura o código HTTP
          HTTP_STATUS=$(curl -sSL -w "%{http_code}" -u "${SONAR_TOKEN}:" "${SONAR_ISSUES_URL}" -o raw_response.json)
          echo "Status HTTP retornado: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Falha na requisição ao SonarQube (HTTP $HTTP_STATUS)!"
            echo "--- Resposta do servidor ---"
            cat raw_response.json
            echo "----------------------------"
            exit 1
          fi

          # 3. Valida se o retorno é um JSON contendo a chave 'issues'
          if ! jq -e '.issues' raw_response.json > /dev/null 2>&1; then
            echo "::error::A resposta da API não contém a lista '.issues'. Verifique se a URL aponta para a API correta (/api/issues/search)."
            echo "--- Conteúdo inicial da resposta ---"
            head -n 20 raw_response.json
            echo "------------------------------------"
            exit 1
          fi

          # 4. Formata os apontamentos com jq
          jq '[.issues[] | {
              file: (.component | split(":") | last),
              line: .line,
              rule: .rule,
              severity: .severity,
              type: .type,
              message: .message
            }]' raw_response.json > sonar_issues.json

          rm -f raw_response.json

          TOTAL=$(jq '. | length' sonar_issues.json)
          echo "Total de apontamentos encontrados: $TOTAL"

      - name: Salvar sonar_issues.json no Repositório
        run: |
          # Só prossegue se o arquivo existir e tiver conteúdo (> 0 bytes)
          if [ ! -s sonar_issues.json ]; then
            echo "::warning::O arquivo sonar_issues.json está vazio (0 bytes). Nenhum commit será realizado."
            exit 0
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add sonar_issues.json
          
          # Só commita se houver alterações no arquivo
          if git diff --staged --quiet; then
            echo "Nenhuma alteração encontrada nos apontamentos."
          else
            git commit -m "chore: atualiza relatório sonar_issues.json para o Antigravity"
            git push
          fi
